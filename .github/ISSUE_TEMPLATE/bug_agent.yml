name: "Bug Report (Agent-Ready)"
description: "Report unexpected behavior. Structured for both human triage and LLM-agent parsing."
title: "[Bug]: "
labels: ["status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Fields below map directly to our ProjectV2 board columns
        (`Component`, `Priority`) so the sync agent can route this ticket
        without manual re-labeling.

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open a graph with 3+ nested subgraphs
        2. Toggle text-sync mode
        3. Observe...
      render: markdown
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Must match a component:* label in github/config/project_labels.json.
      options:
        - "component:graph-engine"
        - "component:text-sync"
        - "component:ui-canvas"
        - "component:lsp-bridge"
        - "component:cli"
        - "component:ci-automation"
        - "component:docs"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Must match a priority:* label in github/config/project_labels.json.
      options:
        - "priority:p0-blocker"
        - "priority:p1-high"
        - "priority:p2-medium"
        - "priority:p3-low"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, browser/runtime version, app version/commit SHA"

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any stack trace or console output. Will be auto-formatted as code.
      render: shell

  - type: checkboxes
    id: agent_ack
    attributes:
      label: Agent Routing
      options:
        - label: I understand this issue may be picked up, scoped, or commented on by an automation agent (see github/scripts/agent_tools.py).
          required: false
