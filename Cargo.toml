# Cargo workspace root for Visual Graph Programming.
# `cargo build` / `cargo test` from the repo root covers every Rust module.
# Add future Rust crates (e.g. a Rust rewrite of a core component or extra
# Tauri plugins) to `members` to include them in the workspace.

[workspace]
resolver = "2"
members = [
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
repository = "https://github.com/ACFHarbinger/Visual-Graph-Programming"
authors = ["ACFHarbinger"]

# Shared dependency versions — member crates inherit with `{ workspace = true }`.
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
