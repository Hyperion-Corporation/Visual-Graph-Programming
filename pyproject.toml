[project]
name = "visual-graph-programming"
version = "0.1.0"
description = "A tool that enables a developer to seamlessly transition from the traditional text-based view to an interactive graph-based view (and vice-versa) during programming."
readme = "README.md"
requires-python = ">=3.10"

# Core dependencies for the Python backend module (backend/):
# graph storage bindings, Graph-RAG retrieval, OR layout optimization,
# MCP server, and sidecar IPC.
dependencies = [
    # Embedded graph + vector database (shared with the C++ base module)
    "grafeo>=0.3,<1.0",
    # Graph algorithms and analysis
    "networkx>=3.2,<4.0",
    "numpy>=1.26,<3.0",
    "scipy>=1.11,<2.0",
    # Operations Research layout engine (stress majorization / MIP)
    "ortools>=9.10,<10.0",
    # Incremental parsing (mirrors the C++ pipeline for sidecar-only flows)
    "tree-sitter>=0.23,<0.26",
    "tree-sitter-cpp>=0.23,<0.24",
    "tree-sitter-python>=0.23,<0.24",
    "tree-sitter-typescript>=0.23,<0.24",
    # Model Context Protocol server (LLM agent integration)
    "mcp>=1.2,<2.0",
    # IPC with the Tauri app / engine plugin
    "websockets>=13.0,<15.0",
    # Semantic visual diffing between commits
    "GitPython>=3.1,<4.0",
    # Config & data models
    "pydantic>=2.7,<3.0",
    "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
# Heavy ML stack for code embeddings and Graph-RAG (GPU optional).
ml = [
    "torch>=2.4,<3.0",
    "sentence-transformers>=3.0,<4.0",
]

# Development / QA tooling.
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "types-PyYAML",
]

# Sidecar packaging for the Tauri app (roadmap step A2.6).
package = [
    "pyinstaller>=6.10,<7.0",
]

# Dependencies for the repo automation suite under github/scripts/
# (agent_tools.py, sync_backlog.py, check_commit_ref.py) and the
# github/hooks/pre-commit config-validation step.
# Install with: pip install -e ".[ci]"
ci = [
    "requests>=2.32,<3.0",
    "PyYAML>=6.0,<7.0",
    "google-genai>=0.3,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/test"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["backend", "github/scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["backend"]

[tool.coverage.run]
source = ["backend"]
