[project]
name = "visual-graph-programming-workspace"
version = "0.1.0"
description = "Root workspace manifest for Visual-Graph-Programming. The actual Python module lives in backend/ (see backend/pyproject.toml)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["backend"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/test"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "github/scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["backend"]

[tool.coverage.run]
source = ["backend"]
